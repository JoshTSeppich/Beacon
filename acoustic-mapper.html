// AUDIO ENGINE
// ============================================================

class AcousticEngine {
  constructor() {
    this.audioCtx = null;
    this.stream = null;
    this.latencyMs = 0;
    this.isRunning = false;
  }

  async init() {
    // getUserMedia requires HTTPS or localhost — check for secure context
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        window.isSecureContext === false
          ? 'Microphone access requires HTTPS. Please serve this page over HTTPS or open it on localhost.'
          : 'Your browser does not support microphone access (getUserMedia).'
      );
    }
    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)({
      sampleRate: SAMPLE_RATE,
    });
    // Resume AudioContext if suspended (required by iOS Safari autoplay policy)
    if (this.audioCtx.state === 'suspended') {
      await this.audioCtx.resume();
    }
    if (this.audioCtx.sampleRate !== SAMPLE_RATE) {
      console.warn(`Requested ${SAMPLE_RATE}Hz, got ${this.audioCtx.sampleRate}Hz`);
    }
    this.stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        sampleRate: SAMPLE_RATE,
      },
    });
  }

  async calibrateLatency(onProgress) {
    if (!this.audioCtx || !this.stream) throw new Error('Not initialized');
    onProgress?.('Calibrating audio latency...');

    // 7 measurements with outlier rejection for robust latency estimation
    const measurements = [];
    for (let attempt = 0; attempt < 7; attempt++) {
      const latency = await this._measureSingleLatency();
      if (latency > 5 && latency < 300) measurements.push(latency);
      await this._wait(500); // longer gap to avoid reverb contamination
    }

    if (measurements.length >= 3) {
      measurements.sort((a, b) => a - b);
      const trimmed = measurements.slice(1, -1);
      this.latencyMs = trimmed[Math.floor(trimmed.length / 2)];
    } else {
      this.latencyMs = measurements.length > 0
        ? measurements.reduce((a, b) => a + b, 0) / measurements.length
        : 15; // reasonable default for same-device speaker/mic
    }

    // Log API-reported latency for diagnostics (ScriptProcessor buffering IS part of the
    // real system delay — the measured value correctly includes it and should NOT be capped)
    const apiLatencyMs = ((this.audioCtx.outputLatency || 0) + (this.audioCtx.baseLatency || 0)) * 1000;
    if (apiLatencyMs > 0) {
      console.log(`Latency cross-check: measured ${this.latencyMs.toFixed(1)}ms, API reports ${apiLatencyMs.toFixed(1)}ms (output+base only, excludes ScriptProcessor buffer)`);
    }

    onProgress?.(`Latency: ${this.latencyMs.toFixed(1)} ms`);
    return this.latencyMs;
  }

  async _measureSingleLatency() {
    const ctx = this.audioCtx;
    const dur = 0.005; // 5ms impulse
    const recDur = 0.15; // record 150ms (longer to catch high-latency devices)
    const buf = ctx.createBuffer(1, Math.round(dur * ctx.sampleRate), ctx.sampleRate);
    const data = buf.getChannelData(0);
    // Short click
    for (let i = 0; i < data.length; i++) {
      data[i] = (i < data.length / 2) ? 0.9 : -0.9;
    }

    const recorded = await this._emitAndRecord(buf, recDur);
    // Use cross-correlation for sub-buffer-boundary precision
    const corr = crossCorrelate(data, recorded);
    // Find the correlation peak with parabolic interpolation
    let maxVal = 0, maxIdx = 0;
    for (let i = 0; i < Math.min(corr.length, recorded.length); i++) {
      if (Math.abs(corr[i]) > maxVal) {
        maxVal = Math.abs(corr[i]);
        maxIdx = i;
      }
    }
    if (maxVal < 0.001) return -1; // too quiet
    // Parabolic sub-sample interpolation for sub-buffer-boundary precision
    let refinedIdx = maxIdx;
    if (maxIdx > 0 && maxIdx < corr.length - 1) {
      const a = corr[maxIdx - 1], b = corr[maxIdx], c = corr[maxIdx + 1];
      const denom = a - 2 * b + c;
      if (denom !== 0) {
        const offset = Math.max(-0.5, Math.min(0.5, 0.5 * (a - c) / denom));
        refinedIdx = maxIdx + offset;
      }
    }
    return (refinedIdx / ctx.sampleRate) * 1000;
  }

  async _emitAndRecord(audioBuffer, recordDurationS) {
    const ctx = this.audioCtx;
    const totalSamples = Math.round(recordDurationS * ctx.sampleRate);
    const recorded = new Float32Array(totalSamples);
    let writeIdx = 0;

    return new Promise((resolve, reject) => {
      const source = ctx.createMediaStreamSource(this.stream);
      const processor = ctx.createScriptProcessor(2048, 1, 1);
      let settled = false;

      const cleanup = () => {
        if (settled) return;
        settled = true;
        try { processor.disconnect(); } catch (_) {}
        try { source.disconnect(); } catch (_) {}
      };

      // Timeout: reject if recording doesn't complete in 2x expected duration
      const timeoutMs = Math.max(recordDurationS * 2000 + 2000, 5000);
      const timer = setTimeout(() => {
        cleanup();
        resolve(recorded); // return partial recording rather than hanging
      }, timeoutMs);

      processor.onaudioprocess = (e) => {
        if (settled) return;
        const input = e.inputBuffer.getChannelData(0);
        for (let i = 0; i < input.length && writeIdx < totalSamples; i++) {
          recorded[writeIdx++] = input[i];
        }
        if (writeIdx >= totalSamples) {
          clearTimeout(timer);
          cleanup();
          resolve(recorded);
        }
      };
      source.connect(processor);
      // Connect to a silent sink (gain=0) to keep ScriptProcessor alive
      // WITHOUT routing mic audio back to the speaker (prevents feedback loop)
      const silentSink = ctx.createGain();
      silentSink.gain.value = 0;
      processor.connect(silentSink);
      // Must connect to destination for ScriptProcessor to fire callbacks in Chrome
      // gain=0 prevents audible output; the graph-level feedback is attenuated to zero
      silentSink.connect(ctx.destination);

      // Play the buffer
      const player = ctx.createBufferSource();
      player.buffer = audioBuffer;
      player.connect(ctx.destination);
      player.start();
    });
  }

  async recordAmbient(durationS, onProgress, onWaveform) {
    onProgress?.('Capturing ambient noise baseline...');
    const totalSamples = Math.round(durationS * this.audioCtx.sampleRate);
    const recorded = new Float32Array(totalSamples);
    let writeIdx = 0;

    return new Promise((resolve) => {
      const source = this.audioCtx.createMediaStreamSource(this.stream);
      const processor = this.audioCtx.createScriptProcessor(2048, 1, 1);
      let settled = false;

      const cleanup = () => {
        if (settled) return;
        settled = true;
        try { processor.disconnect(); } catch (_) {}
        try { source.disconnect(); } catch (_) {}
      };

      // Timeout: resolve with partial recording rather than hanging forever
      // (e.g. if AudioContext is suspended and onaudioprocess never fires)
      const timeoutMs = Math.max(durationS * 2000 + 2000, 5000);
      const timer = setTimeout(() => {
        cleanup();
        resolve(recorded);
      }, timeoutMs);

      processor.onaudioprocess = (e) => {
        if (settled) return;
        const input = e.inputBuffer.getChannelData(0);
        for (let i = 0; i < input.length && writeIdx < totalSamples; i++) {
          recorded[writeIdx++] = input[i];
        }
        onWaveform?.(input);
        if (writeIdx >= totalSamples) {
          clearTimeout(timer);
          cleanup();
          resolve(recorded);
        }
      };
      source.connect(processor);
      const sink = this.audioCtx.createGain();
      sink.gain.value = 0;
      processor.connect(sink);
      sink.connect(this.audioCtx.destination); // required for ScriptProcessor callbacks in Chrome
    });
  }

  // v2: Rapid ESS sweep burst — 40 sweeps at 20Hz for delay-rate tracking
  async emitSweepBurst(noiseFloor, sweepCount, onProgress, onWaveform) {
    const count = sweepCount || ESS_BURST_COUNT;
    const sr = this.audioCtx.sampleRate; // MUST be declared before use
    const sweep = generateExponentialSweep(ESS_F1, ESS_F2, ESS_DURATION_S, sr);
    const invFilter = generateInverseFilter(sweep, ESS_F1, ESS_F2, ESS_DURATION_S, sr);
    const latSamples = Math.round(this.latencyMs * sr / 1000);
    const echoHistory = [];
    const sweepTimestamps = [];
    const responses = []; // backward compat
    let lastRIR = null;
    let rirAccumulator = null;

    for (let i = 0; i < count; i++) {
      const sweepStartTime = performance.now() / 1000; // timestamp BEFORE emit
      onProgress?.(`Scanning... (${i+1} of ${count})`);
      const buf = this.audioCtx.createBuffer(1, sweep.length, sr);
      buf.getChannelData(0).set(sweep);
      // Include latency margin so echo window isn't truncated on high-latency devices
      const recDur = ESS_DURATION_S + ESS_ECHO_WINDOW_S + this.latencyMs / 1000;
      const recording = await this._emitAndRecord(buf, recDur);
      onWaveform?.(recording.slice(-2048));

      const rir = deconvolveImpulseResponse(recording, invFilter);
      lastRIR = rir;
      // Accumulate RIRs for coherent averaging (reduces RT60 variance by √N)
      if (!rirAccumulator) {
        rirAccumulator = new Float32Array(rir.length);
      }
      for (let j = 0; j < Math.min(rir.length, rirAccumulator.length); j++) {
        rirAccumulator[j] += rir[j];
      }
      // Direct-path peak in deconvolved RIR is at (sweepLength-1) + latencySamples,
      // NOT at latencySamples — the linear convolution of a signal with its time-reverse
      // peaks at N-1 samples offset. Search from the direct path onward.
      const directPathIdx = (sweep.length - 1) + latSamples;
      const maxSearchIdx = directPathIdx + Math.round(ESS_ECHO_WINDOW_S * sr);
      const peaks = extractEchoPeaks(rir, directPathIdx, sr, 8, maxSearchIdx);

      echoHistory.push(peaks);
      sweepTimestamps.push(sweepStartTime); // use pre-emit timestamp for consistent tracking

      // Build backward-compatible response entry
      if (peaks.length > 0) {
        const emittedSpec = averageSpectrum(sweep, 512, 256);
        for (const p of peaks) p.material = MATERIAL_CLASSES.UNKNOWN;
        responses.push({ chirp: { center: (ESS_F1+ESS_F2)/2, duration: ESS_DURATION_S, bandwidth: ESS_BANDWIDTH }, reflections: peaks, emittedSpectrum: emittedSpec });
      }

      // Brief pause between sweeps (remaining time in period)
      const elapsed = performance.now() / 1000 - sweepTimestamps[i];
      const remaining = ESS_SWEEP_PERIOD_S - elapsed;
      if (remaining > 0.005) await this._wait(remaining * 1000);
    }

    // Average the accumulated RIR across all sweeps
    if (rirAccumulator) {
      for (let j = 0; j < rirAccumulator.length; j++) rirAccumulator[j] /= count;
    }

    // Estimate RT60 from averaged RIR (reduces variance by √N vs. single sweep)
    const lastDirectPathIdx = (sweep.length - 1) + latSamples;
    const rt60 = rirAccumulator ? estimateRT60FromRIR(rirAccumulator, sr, lastDirectPathIdx) : null;

    return { echoHistory, sweepTimestamps, responses, rt60, sweep, invFilter };
  }

  // Legacy wrapper for backward compatibility
  async emitChirpSequence(noiseFloor, onProgress, onWaveform) {
    const result = await this.emitSweepBurst(noiseFloor, ESS_BURST_COUNT, onProgress, onWaveform);
    return { responses: result.responses, tailReverb: new Float32Array(0), ...result };
  }

  // (v1 chirp sequence removed — replaced by emitSweepBurst above)

  async measureInterference(modalPeaks, onProgress) {
    const results = [];
    const peaksToTest = modalPeaks.slice(0, 5);

    for (let i = 0; i < peaksToTest.length; i++) {
      const peak = peaksToTest[i];
      onProgress?.(`Modal decay test ${i + 1}/${peaksToTest.length}: ${peak.frequency.toFixed(0)} Hz`);

      // Emit a tone burst at the modal frequency, then measure its decay
      const toneDur = 0.1; // 100ms burst
      const decayDur = 0.3; // 300ms of decay recording after burst ends
      const toneLen = Math.round(toneDur * this.audioCtx.sampleRate);
      const toneBuf = this.audioCtx.createBuffer(1, toneLen, this.audioCtx.sampleRate);
      const toneData = toneBuf.getChannelData(0);
      for (let j = 0; j < toneLen; j++) {
        // Smooth envelope to avoid clicks
        const env = Math.sin(Math.PI * j / toneLen);
        toneData[j] = Math.sin(2 * Math.PI * peak.frequency * j / this.audioCtx.sampleRate) * 0.5 * env;
      }

      // Record tone + decay tail
      const rec = await this._emitAndRecord(toneBuf, toneDur + decayDur);

      // Measure energy in the tone region vs decay region
      const toneSamples = Math.round(toneDur * this.audioCtx.sampleRate);
      const decaySamples = rec.length - toneSamples;
      let toneEnergy = 0, decayEnergy = 0;
      for (let j = 0; j < toneSamples && j < rec.length; j++) toneEnergy += rec[j] * rec[j];
      for (let j = toneSamples; j < rec.length; j++) decayEnergy += rec[j] * rec[j];
      toneEnergy /= toneSamples || 1;
      decayEnergy /= decaySamples || 1;

      // Estimate T20 (time for 20dB decay) from energy envelope in decay region
      // Compute energy in 10ms windows across the decay
      const windowMs = 10;
      const windowSamples = Math.round(windowMs * this.audioCtx.sampleRate / 1000);
      const decayEnvelope = [];
      for (let j = toneSamples; j + windowSamples <= rec.length; j += windowSamples) {
        let winEnergy = 0;
        for (let k = j; k < j + windowSamples; k++) winEnergy += rec[k] * rec[k];
        decayEnvelope.push(winEnergy / windowSamples);
      }

      // Find T20: time for energy to drop 20dB from peak
      let t20Ms = decayDur * 1000; // default: full decay window
      if (decayEnvelope.length > 2) {
        const peakEnergy = Math.max(...decayEnvelope);
        const threshold20 = peakEnergy * 0.01; // -20dB
        for (let j = 0; j < decayEnvelope.length; j++) {
          if (decayEnvelope[j] < threshold20) {
            t20Ms = j * windowMs;
            break;
          }
        }
      }

      // Estimate RT60 from T20 (RT60 ≈ 3 × T20)
      const rt60 = (t20Ms / 1000) * 3;
      // Q factor from RT60: Q = π × f × RT60 / ln(1000) ≈ π × f × RT60 / 6.908
      const qFactor = Math.PI * peak.frequency * rt60 / 6.908;

      results.push({
        frequency: peak.frequency,
        toneEnergy,
        decayEnergy,
        gainRatio: toneEnergy / (decayEnergy + 1e-10),
        qFactor,
        t20Ms,
        rt60,
        cancellationDb: 10 * Math.log10(decayEnergy / (toneEnergy + 1e-10)),
      });

      await this._wait(100);
    }
    return results;
  }

  // Continuous voice monitoring
  startVoiceMonitoring(callback) {
    const source = this.audioCtx.createMediaStreamSource(this.stream);
    const analyser = this.audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Float32Array(bufferLength);

    const update = () => {
      if (!this.isRunning) return;
      analyser.getFloatFrequencyData(dataArray);
      // Convert from dB to linear
      const linear = new Float32Array(bufferLength);
      for (let i = 0; i < bufferLength; i++) {
        linear[i] = Math.pow(10, dataArray[i] / 20);
      }
      callback(linear);
      requestAnimationFrame(update);
    };
    this.isRunning = true;
    update();
    return () => { this.isRunning = false; source.disconnect(); };
  }

  // Footstep detection — passive monitoring for impact transients in 50-300Hz band
  startFootstepDetection(noiseFloor, callback) {
    if (!this.audioCtx || !this.stream) return () => {};
    const ctx = this.audioCtx;
    const source = ctx.createMediaStreamSource(this.stream);

    // Bandpass filter chain: highpass(50Hz) -> lowpass(300Hz)
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = FOOTSTEP_BAND_LOW;
    hp.Q.value = 0.7;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = FOOTSTEP_BAND_HIGH;
    lp.Q.value = 0.7;

    const processor = ctx.createScriptProcessor(2048, 1, 1);
    let runningEnergy = 0;
    let lastDetectionTime = 0;
    let active = true;

    processor.onaudioprocess = (e) => {
      if (!active || this._miniChirpActive) return; // pause during chirp bursts
      const input = e.inputBuffer.getChannelData(0);

      // Compute frame energy
      let energy = 0;
      for (let i = 0; i < input.length; i++) energy += input[i] * input[i];
      energy /= input.length;

      // Exponential moving average
      if (runningEnergy === 0) runningEnergy = energy;
      else runningEnergy = runningEnergy * (1 - FOOTSTEP_EMA_ALPHA) + energy * FOOTSTEP_EMA_ALPHA;

      // Transient detection
      const now = performance.now();
      if (energy > runningEnergy * FOOTSTEP_ENERGY_MULT &&
          energy > 1e-6 &&
          now - lastDetectionTime > FOOTSTEP_MIN_INTERVAL_MS) {
        lastDetectionTime = now;

        // Classify floor material from impact spectrum
        const win = getHanningWindow(Math.min(input.length, 512));
        const padN = nextPow2(win.length);
        const re = new Float32Array(padN);
        const im = new Float32Array(padN);
        for (let i = 0; i < win.length; i++) re[i] = input[i] * win[i];
        fft(re, im);
        const impactSpectrum = magnitudeSpectrum(re, im);

        // Use reference spectrum comparison for floor material
        const floorMaterial = classifyFloorFromImpact(impactSpectrum);

        callback({
          timestamp: now,
          energy,
          floorMaterial,
          impactSpectrum,
        });
      }
    };

    source.connect(hp);
    hp.connect(lp);
    lp.connect(processor);
    const fsSink = ctx.createGain();
    fsSink.gain.value = 0;
    processor.connect(fsSink);
    fsSink.connect(ctx.destination); // required for ScriptProcessor callbacks in Chrome

    return () => {
      active = false;
      processor.disconnect();
      lp.disconnect();
      hp.disconnect();
      source.disconnect();
    };
  }

  // Walking mode: short ESS burst (20 sweeps, 1s)
  async emitMiniChirpBurst(noiseFloor, onProgress) {
    this._miniChirpActive = true;
    try {
      const result = await this.emitSweepBurst(noiseFloor, WALKING_BURST_COUNT, onProgress, null);
      return result.responses.flatMap(r => r.reflections);
    } finally {
      this._miniChirpActive = false;
    }
  }

  _wait(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  dispose() {
    this.isRunning = false;
    this._miniChirpActive = false;
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.audioCtx) this.audioCtx.close();
  }
}

// ============================================================
// IMU TRACKER (accelerometer + gyroscope for dead reckoning)
// ============================================================

class IMUTracker {
  constructor() {
    this.hasPermission = false;
    this.isTracking = false;
    this.heading = 0;
    this.position = { x: 0, y: 0 };
    this.velocity = { x: 0, y: 0 };
    this.stepCount = 0;
    this.strideLength = DEFAULT_STRIDE_M;
    this.lastStepTime = 0;
    this.onStep = null;
    this.onPositionUpdate = null;

    // Low-pass filter state for gravity separation (~0.1Hz corner at 60Hz)
    this._gravity = { x: 0, y: 0, z: 9.81 };
    this._lpAlpha = 0.01;
    this._gravityInitialized = false;
    this._gravityInitSamples = [];

    // Step detection state machine
    this._stepState = 'idle'; // idle | rising | falling
    this._stepStateEntered = 0;
    this._peakAccel = 0;
    this._lastMotionTime = 0;

    // Heading from gyroscope
    this._lastGyroTime = 0;

    // v2: velocity history for delay-rate surface normal estimation
    this.velocityHistory = [];
    this.orientationHistory = [];
    this._linearVelocity = { x: 0, y: 0, z: 0 };

    this._boundHandler = this._handleMotion.bind(this);
  }

  async requestPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      // iOS 13+
      const perm = await DeviceMotionEvent.requestPermission();
      this.hasPermission = perm === 'granted';
    } else {
      // Android / older iOS — no permission needed
      this.hasPermission = true;
    }
    return this.hasPermission;
  }

  start(onStep, onPositionUpdate) {
    if (!this.hasPermission) return false;
    this.onStep = onStep;
    this.onPositionUpdate = onPositionUpdate;
    this.isTracking = true;
    this._lastGyroTime = performance.now();
    this._lastMotionTime = performance.now();
    window.addEventListener('devicemotion', this._boundHandler);
    return true;
  }

  stop() {
    this.isTracking = false;
    window.removeEventListener('devicemotion', this._boundHandler);
  }

  getPosition() {
    return { ...this.position };
  }

  correctPosition(acousticPos, confidence) {
    if (!acousticPos) return;
    // Don't apply corrections larger than 2m (likely a bad acoustic fix)
    const errX = acousticPos.x - this.position.x;
    const errY = acousticPos.y - this.position.y;
    const errDist = Math.sqrt(errX * errX + errY * errY);
    if (errDist > 2.0) return;
    // Scale correction by acoustic confidence
    const alpha = DRIFT_CORRECTION_RATE * Math.min(1, confidence || 0.6);
    this.position.x += errX * alpha;
    this.position.y += errY * alpha;
  }

  calibrateStride(acousticDistance, steps) {
    // Require meaningful sample: 8+ steps, 1.5m+ displacement
    if (steps < 8 || acousticDistance < 1.5) return;
    const measured = acousticDistance / steps;
    // Sanity: human stride is 0.4–1.2m
    if (measured < 0.4 || measured > 1.2) return;
    this.strideLength = this.strideLength * 0.8 + measured * 0.2;
  }

  _handleMotion(event) {
    const now = performance.now();
    const dt = (now - this._lastMotionTime) / 1000;
    this._lastMotionTime = now;
    if (dt <= 0 || dt > 0.5) return;

    const ag = event.accelerationIncludingGravity;
    if (!ag || ag.x === null) return;

    // Initialize gravity from first 30 samples (~0.5s at 60Hz) with motion rejection
    if (!this._gravityInitialized) {
      this._gravityInitSamples.push({ x: ag.x, y: ag.y, z: ag.z });
      if (this._gravityInitSamples.length >= 30) {
        const n = this._gravityInitSamples.length;
        const mx = this._gravityInitSamples.reduce((s, v) => s + v.x, 0) / n;
        const my = this._gravityInitSamples.reduce((s, v) => s + v.y, 0) / n;
        const mz = this._gravityInitSamples.reduce((s, v) => s + v.z, 0) / n;
        // Check variance — reject if phone was moving during init (stddev > 0.15g)
        let variance = 0;
        for (const s of this._gravityInitSamples) {
          variance += (s.x-mx)**2 + (s.y-my)**2 + (s.z-mz)**2;
        }
        variance = Math.sqrt(variance / n);
        if (variance > 1.47) { // 0.15g * 9.81 = 1.47 m/s²
          // Too much motion — discard and retry with fresh samples
          this._gravityInitSamples = [];
          return;
        }
        this._gravity.x = mx;
        this._gravity.y = my;
        this._gravity.z = mz;
        this._gravityInitialized = true;
      }
      return;
    }

    // Low-pass filter gravity (~0.1Hz corner)
    this._gravity.x = this._gravity.x * (1 - this._lpAlpha) + ag.x * this._lpAlpha;
    this._gravity.y = this._gravity.y * (1 - this._lpAlpha) + ag.y * this._lpAlpha;
    this._gravity.z = this._gravity.z * (1 - this._lpAlpha) + ag.z * this._lpAlpha;

    // Prefer OS-provided linear acceleration if available, else subtract gravity
    const accel = event.acceleration;
    let ax, ay, az;
    if (accel && accel.x !== null) {
      ax = accel.x; ay = accel.y; az = accel.z;
    } else {
      ax = ag.x - this._gravity.x;
      ay = ag.y - this._gravity.y;
      az = ag.z - this._gravity.z;
    }
    const accelMag = Math.sqrt(ax * ax + ay * ay + az * az) / 9.81;

    // Integrate heading — select correct yaw axis based on gravity direction
    const rr = event.rotationRate;
    if (rr && rr.alpha !== null) {
      const gravMag = Math.sqrt(
        this._gravity.x ** 2 + this._gravity.y ** 2 + this._gravity.z ** 2
      ) || 9.81;
      const absGx = Math.abs(this._gravity.x / gravMag);
      const absGy = Math.abs(this._gravity.y / gravMag);
      const absGz = Math.abs(this._gravity.z / gravMag);

      let yawRate = 0;
      if (absGz > 0.7) {
        // Phone flat: Z-axis is up, alpha = yaw
        yawRate = rr.alpha * Math.sign(this._gravity.z);
      } else if (absGy > 0.7) {
        // Phone portrait: gravity along device Y, yaw = gamma (rotation about device Y-axis)
        yawRate = rr.gamma * Math.sign(this._gravity.y);
      } else {
        // Phone landscape: gravity along device X, yaw = beta (rotation about device X-axis)
        yawRate = rr.beta * Math.sign(this._gravity.x);
      }
      this.heading += (yawRate * Math.PI / 180) * dt;
      // Wrap heading to [0, 2π)
      this.heading = ((this.heading % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    }

    // v2: Track velocity for delay-rate surface normal estimation
    // High-pass filter (α=0.98) preserves 8-12Hz tremor, rejects DC drift
    this._linearVelocity.x = 0.98 * (this._linearVelocity.x + ax * dt);
    this._linearVelocity.y = 0.98 * (this._linearVelocity.y + ay * dt);
    this._linearVelocity.z = 0.98 * (this._linearVelocity.z + az * dt);
    const nowSec = now / 1000;
    this.velocityHistory.push({ time: nowSec, vx: this._linearVelocity.x, vy: this._linearVelocity.y, vz: this._linearVelocity.z });
    this.orientationHistory.push({ time: nowSec, heading: this.heading });
    // Trim to last 5 seconds
    const cutoff = nowSec - 5;
    while (this.velocityHistory.length > 0 && this.velocityHistory[0].time < cutoff) this.velocityHistory.shift();
    while (this.orientationHistory.length > 0 && this.orientationHistory[0].time < cutoff) this.orientationHistory.shift();

    // Step detection state machine
    this._detectStep(accelMag, now);
  }

  _detectStep(accelMag, now) {
    switch (this._stepState) {
      case 'idle':
        if (accelMag > STEP_THRESHOLD_G) {
          this._stepState = 'rising';
          this._stepStateEntered = now;
          this._peakAccel = accelMag;
        }
        break;
      case 'rising':
        if (accelMag > this._peakAccel) {
          this._peakAccel = accelMag;
        } else {
          this._stepState = 'falling';
          this._stepStateEntered = now;
        }
        break;
      case 'falling':
        // Timeout: escape if stuck in falling for > 400ms
        if (now - this._stepStateEntered > 400) {
          this._stepState = 'idle';
          this._peakAccel = 0;
          break;
        }
        if (accelMag < STEP_THRESHOLD_G * 0.7) {
          if (now - this.lastStepTime > MIN_STEP_INTERVAL_MS) {
            this._fireStep(now);
          }
          this._stepState = 'idle';
          this._peakAccel = 0;
        }
        break;
    }
  }

  _fireStep(now) {
    this.lastStepTime = now;
    this.stepCount++;

    // Dead reckoning: heading=0 is North (up on screen), clockwise-positive
    // Screen coords: Y increases downward, so cos(heading) maps to Y (forward)
    const dx = this.strideLength * Math.sin(this.heading);
    const dy = -this.strideLength * Math.cos(this.heading); // heading=0 (North) → -y (up on screen)
    this.position.x += dx;
    this.position.y += dy;

    this.onStep?.({
      stepCount: this.stepCount,
      position: { ...this.position },
      heading: this.heading,
      timestamp: now,
    });
    this.onPositionUpdate?.({ ...this.position });
  }
}

function WaveformCanvas({ data, width, height, color }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || !data || data.length === 0) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = '#111119';
    ctx.fillRect(0, 0, width, height);

    ctx.strokeStyle = color || '#00f5ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const step = data.length / width;
    const mid = height / 2;
    for (let x = 0; x < width; x++) {
      const i = Math.floor(x * step);
      const y = mid + data[i] * mid * 0.9;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Center line
    ctx.strokeStyle = 'rgba(0,245,255,0.15)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(0, mid);
    ctx.lineTo(width, mid);
    ctx.stroke();
  }, [data, width, height, color]);

  return <canvas ref={canvasRef} style={{ width, height }} className="rounded-lg" />;
}

function FloorPlan({ geometry, width, height }) {
  if (!geometry || !geometry.x || !geometry.y) {
    return <div className="bg-surface rounded-lg flex items-center justify-center" style={{ width, height }}>
      <span className="text-beacon-dim text-sm">No geometry data</span>
    </div>;
  }

  const padding = 40;
  const drawW = width - padding * 2;
  const drawH = height - padding * 2;
  const scale = Math.min(drawW / geometry.x, drawH / geometry.y);
  const roomW = geometry.x * scale;
  const roomH = geometry.y * scale;
  const offsetX = (width - roomW) / 2;
  const offsetY = (height - roomH) / 2;

  const phoneX = geometry.phonePosition?.x != null ? offsetX + geometry.phonePosition.x * scale : offsetX + roomW / 2;
  const phoneY = geometry.phonePosition?.y != null ? offsetY + geometry.phonePosition.y * scale : offsetY + roomH / 2;

  return (
    <svg width={width} height={height} className="rounded-lg bg-surface">
      {/* Grid */}
      {Array.from({ length: Math.ceil(geometry.x) + 1 }, (_, i) => (
        <line key={`vg${i}`}
          x1={offsetX + i * scale} y1={offsetY}
          x2={offsetX + i * scale} y2={offsetY + roomH}
          stroke="rgba(0,245,255,0.08)" strokeWidth="0.5" />
      ))}
      {Array.from({ length: Math.ceil(geometry.y) + 1 }, (_, i) => (
        <line key={`hg${i}`}
          x1={offsetX} y1={offsetY + i * scale}
          x2={offsetX + roomW} y2={offsetY + i * scale}
          stroke="rgba(0,245,255,0.08)" strokeWidth="0.5" />
      ))}

      {/* Room outline */}
      <rect x={offsetX} y={offsetY} width={roomW} height={roomH}
        fill="none" stroke="#00f5ff" strokeWidth="2" rx="2" />

      {/* Wall labels with materials */}
      {geometry.walls?.slice(0, 4).map((w, i) => {
        const positions = [
          { x: offsetX + roomW / 2, y: offsetY - 8, anchor: 'middle' },
          { x: offsetX + roomW + 8, y: offsetY + roomH / 2, anchor: 'start' },
          { x: offsetX + roomW / 2, y: offsetY + roomH + 16, anchor: 'middle' },
          { x: offsetX - 8, y: offsetY + roomH / 2, anchor: 'end' },
        ];
        const pos = positions[i] || positions[0];
        return <text key={`wl${i}`} x={pos.x} y={pos.y}
          fill={w.material?.color || '#888'} fontSize="10"
          textAnchor={pos.anchor} dominantBaseline="middle">
          {(w.distance ?? 0).toFixed(1)}m
        </text>;
      })}

      {/* Objects */}
      {geometry.objects?.map((obj, i) => {
        const angle = (i / (geometry.objects.length || 1)) * Math.PI * 2;
        const r = obj.distance * scale * 0.8;
        const ox = phoneX + Math.cos(angle) * Math.min(r, roomW * 0.4);
        const oy = phoneY + Math.sin(angle) * Math.min(r, roomH * 0.4);
        return <g key={`obj${i}`}>
          <circle cx={ox} cy={oy} r="6" fill={obj.material?.color || '#888'} opacity="0.6" />
          <text x={ox} y={oy + 14} fill="#aaa" fontSize="8" textAnchor="middle">
            {obj.distance.toFixed(1)}m
          </text>
        </g>;
      })}

      {/* Phone position */}
      <circle cx={phoneX} cy={phoneY} r="6" fill="#00f5ff" />
      <circle cx={phoneX} cy={phoneY} r="12" fill="none" stroke="#00f5ff" strokeWidth="1" opacity="0.4" />
      <text x={phoneX} y={phoneY + 22} fill="#00f5ff" fontSize="9" textAnchor="middle">Phone</text>

      {/* Dimensions */}
      <text x={offsetX + roomW / 2} y={offsetY + roomH + 32}
        fill="#fff" fontSize="12" textAnchor="middle" fontWeight="bold">
        {geometry.x.toFixed(1)}m
      </text>
      <text x={offsetX + roomW + 28} y={offsetY + roomH / 2}
        fill="#fff" fontSize="12" textAnchor="middle" fontWeight="bold"
        transform={`rotate(90, ${offsetX + roomW + 28}, ${offsetY + roomH / 2})`}>
        {geometry.y.toFixed(1)}m
      </text>
    </svg>
  );
}

function SpectralChart({ responses, width, height }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || !responses?.length) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = '#111119';
    ctx.fillRect(0, 0, width, height);

    const colors = [
      '#ff4444', '#ff8844', '#ffaa44', '#ffdd44', '#aaff44',
      '#44ff88', '#44ffdd', '#44ddff', '#4488ff', '#8844ff'
    ];

    const padding = { left: 40, right: 10, top: 10, bottom: 30 };
    const plotW = width - padding.left - padding.right;
    const plotH = height - padding.top - padding.bottom;

    // Axes
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top);
    ctx.lineTo(padding.left, padding.top + plotH);
    ctx.lineTo(padding.left + plotW, padding.top + plotH);
    ctx.stroke();

    // Labels
    ctx.fillStyle = '#666';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Frequency (Hz)', padding.left + plotW / 2, height - 4);

    // All sweeps emit the same ESS signal — emittedSpectrum is identical for every response.
    // Plot only one trace to avoid N overlapping identical lines.
    const firstResp = responses.find(r => r.emittedSpectrum && r.emittedSpectrum.length > 0);
    if (firstResp) {
      const spectrum = firstResp.emittedSpectrum;
      let maxVal = 0;
      for (let i = 0; i < spectrum.length; i++) if (spectrum[i] > maxVal) maxVal = spectrum[i];
      if (maxVal > 0) {
        ctx.strokeStyle = colors[0];
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        for (let i = 0; i < spectrum.length; i++) {
          const x = padding.left + (i / spectrum.length) * plotW;
          const y = padding.top + plotH - (spectrum[i] / maxVal) * plotH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;

        // Legend
        ctx.font = '8px monospace';
        ctx.fillStyle = colors[0];
        ctx.textAlign = 'left';
        ctx.fillText('Emitted Sweep Spectrum', padding.left + 5, padding.top + 12);
      }
    }
  }, [responses, width, height]);

  return <canvas ref={canvasRef} style={{ width, height }} className="rounded-lg" />;
}

function ModalChart({ detectedModes, predictedModes, width, height }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = '#111119';
    ctx.fillRect(0, 0, width, height);

    const padding = { left: 40, right: 10, top: 10, bottom: 30 };
    const plotW = width - padding.left - padding.right;
    const plotH = height - padding.top - padding.bottom;

    const allFreqs = [...(detectedModes || []), ...(predictedModes || [])];
    const validFreqs = allFreqs.filter(f => Number.isFinite(f));
    const maxFreq = validFreqs.length > 0 ? Math.max(...validFreqs) * 1.1 : 1000;

    // Axis
    ctx.strokeStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top + plotH);
    ctx.lineTo(padding.left + plotW, padding.top + plotH);
    ctx.stroke();

    ctx.fillStyle = '#666';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Frequency (Hz)', padding.left + plotW / 2, height - 4);

    // Predicted modes (gray)
    if (predictedModes) {
      predictedModes.forEach(f => {
        const x = padding.left + (f / maxFreq) * plotW;
        ctx.strokeStyle = 'rgba(100,100,100,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, padding.top);
        ctx.lineTo(x, padding.top + plotH);
        ctx.stroke();
      });
    }

    // Detected modes (cyan)
    if (detectedModes) {
      detectedModes.forEach(f => {
        const x = padding.left + (f / maxFreq) * plotW;
        ctx.strokeStyle = '#00f5ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, padding.top + 10);
        ctx.lineTo(x, padding.top + plotH - 5);
        ctx.stroke();
        ctx.fillStyle = '#00f5ff';
        ctx.font = '8px monospace';
        ctx.fillText(`${f.toFixed(0)}`, x, padding.top + 8);
      });
    }

    // Legend
    ctx.fillStyle = '#666';
    ctx.font = '9px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('| Predicted', width - 90, padding.top + 12);
    ctx.fillStyle = '#00f5ff';
    ctx.fillText('| Detected', width - 90, padding.top + 24);
  }, [detectedModes, predictedModes, width, height]);

  return <canvas ref={canvasRef} style={{ width, height }} className="rounded-lg" />;
}

// Progressive floor plan with fog-of-war coverage map
function ProgressiveFloorPlan({ roomModel, width, height }) {
  const canvasRef = useRef(null);
  const geometry = roomModel?.geometry;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || !geometry?.x || !geometry?.y) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);

    const padding = 40;
    const drawW = width - padding * 2;
    const drawH = height - padding * 2;
    const scale = Math.min(drawW / geometry.x, drawH / geometry.y);
    const roomW = geometry.x * scale;
    const roomH = geometry.y * scale;
    const offsetX = (width - roomW) / 2;
    const offsetY = (height - roomH) / 2;

    // Background
    ctx.fillStyle = '#111119';
    ctx.fillRect(0, 0, width, height);

    // Fog of war grid
    if (roomModel.coverageGrid && roomModel.gridWidth > 0) {
      for (let gy = 0; gy < roomModel.gridHeight; gy++) {
        for (let gx = 0; gx < roomModel.gridWidth; gx++) {
          const coverage = roomModel.coverageGrid[gy * roomModel.gridWidth + gx];
          const wx = gx * GRID_RESOLUTION_M + roomModel.gridOffsetX;
          const wy = gy * GRID_RESOLUTION_M + roomModel.gridOffsetY;

          // Convert world coords to screen
          const px = geometry.phonePosition?.x || geometry.x / 2;
          const py = geometry.phonePosition?.y || geometry.y / 2;
          const sx = offsetX + (wx + px) * scale;
          const sy = offsetY + (wy + py) * scale;
          const cellW = GRID_RESOLUTION_M * scale;

          // Only draw within room bounds
          if (sx >= offsetX && sx + cellW <= offsetX + roomW &&
              sy >= offsetY && sy + cellW <= offsetY + roomH) {
            const fogOpacity = Math.max(0, 0.7 - coverage * 0.7);
            if (fogOpacity > 0.02) {
              ctx.fillStyle = `rgba(10, 10, 15, ${fogOpacity})`;
              ctx.fillRect(sx, sy, cellW + 0.5, cellW + 0.5);
            }
            // Confidence tint
            if (coverage > 0.3) {
              ctx.fillStyle = `rgba(0, 245, 255, ${coverage * 0.08})`;
              ctx.fillRect(sx, sy, cellW + 0.5, cellW + 0.5);
            }
          }
        }
      }
    }

    // Room outline
    ctx.strokeStyle = '#00f5ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(offsetX, offsetY, roomW, roomH);

    // Grid lines
    ctx.strokeStyle = 'rgba(0,245,255,0.06)';
    ctx.lineWidth = 0.5;
    for (let m = 1; m < geometry.x; m++) {
      const x = offsetX + m * scale;
      ctx.beginPath(); ctx.moveTo(x, offsetY); ctx.lineTo(x, offsetY + roomH); ctx.stroke();
    }
    for (let m = 1; m < geometry.y; m++) {
      const y = offsetY + m * scale;
      ctx.beginPath(); ctx.moveTo(offsetX, y); ctx.lineTo(offsetX + roomW, y); ctx.stroke();
    }

    // Phone position (origin)
    const phonePx = geometry.phonePosition?.x || geometry.x / 2;
    const phonePy = geometry.phonePosition?.y || geometry.y / 2;

    // Position history trail
    if (roomModel.positionHistory.length > 1) {
      ctx.strokeStyle = 'rgba(0, 245, 255, 0.3)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      roomModel.positionHistory.forEach((p, i) => {
        const sx = offsetX + (p.x + phonePx) * scale;
        const sy = offsetY + (p.y + phonePy) * scale;
        if (i === 0) ctx.moveTo(sx, sy);
        else ctx.lineTo(sx, sy);
      });
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Footstep markers
    roomModel.footsteps.forEach(f => {
      const sx = offsetX + (f.position.x + phonePx) * scale;
      const sy = offsetY + (f.position.y + phonePy) * scale;
      ctx.fillStyle = f.floorMaterial?.color || '#888';
      ctx.beginPath();
      ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Observation points (chirp bursts)
    roomModel.observations.forEach((obs, i) => {
      if (i === 0) return; // skip initial (it's the phone position)
      const sx = offsetX + (obs.position.x + phonePx) * scale;
      const sy = offsetY + (obs.position.y + phonePy) * scale;
      ctx.strokeStyle = 'rgba(0, 245, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sx, sy, 8, 0, Math.PI * 2);
      ctx.stroke();
    });

    // Current position (pulsing dot)
    const curPos = roomModel.currentPosition;
    const curSx = offsetX + (curPos.x + phonePx) * scale;
    const curSy = offsetY + (curPos.y + phonePy) * scale;
    ctx.fillStyle = '#00f5ff';
    ctx.beginPath();
    ctx.arc(curSx, curSy, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 245, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(curSx, curSy, 12, 0, Math.PI * 2);
    ctx.stroke();

    // Phone label at origin
    const originSx = offsetX + phonePx * scale;
    const originSy = offsetY + phonePy * scale;
    if (Math.abs(curSx - originSx) > 15 || Math.abs(curSy - originSy) > 15) {
      ctx.fillStyle = 'rgba(0, 245, 255, 0.4)';
      ctx.beginPath();
      ctx.arc(originSx, originSy, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#666';
      ctx.font = '8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Start', originSx, originSy + 14);
    }

    // Dimension labels
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${geometry.x.toFixed(1)}m`, offsetX + roomW / 2, offsetY + roomH + 20);
    ctx.save();
    ctx.translate(offsetX + roomW + 20, offsetY + roomH / 2);
    ctx.rotate(Math.PI / 2);
    ctx.fillText(`${geometry.y.toFixed(1)}m`, 0, 0);
    ctx.restore();
  }, [roomModel, roomModel?.observations?.length, roomModel?.footsteps?.length,
      roomModel?.currentPosition?.x, roomModel?.currentPosition?.y, width, height]);

  if (!geometry?.x || !geometry?.y) {
    return <div className="bg-surface rounded-lg flex items-center justify-center" style={{ width, height }}>
      <span className="text-beacon-dim text-sm">No geometry data</span>
    </div>;
  }

  return <canvas ref={canvasRef} style={{ width, height }} className="rounded-lg" />;
}
