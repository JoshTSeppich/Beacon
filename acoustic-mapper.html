// IMU permission prompt for walking mode
function IMUPermissionPrompt({ onGranted, onSkip }) {
  const [requesting, setRequesting] = useState(false);
  const [error, setError] = useState(null);

  const handleRequest = useCallback(async () => {
    setRequesting(true);
    setError(null);
    try {
      if (typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function') {
        const perm = await DeviceMotionEvent.requestPermission();
        if (perm === 'granted') {
          onGranted(true);
        } else {
          setError('Motion sensor access denied.');
          onGranted(false);
        }
      } else {
        // Android / desktop — no permission needed
        onGranted(true);
      }
    } catch (e) {
      setError(e.message);
      onGranted(false);
    }
    setRequesting(false);
  }, [onGranted]);

  return (
    <div className="bg-surface rounded-xl p-6 border border-gray-800 text-center">
      <div className="text-4xl mb-3">
        <span role="img" aria-label="walking">&#x1F6B6;</span>
      </div>
      <h3 className="text-beacon font-bold text-lg mb-2">Walking Mode</h3>
      <p className="text-gray-400 text-sm mb-4">
        Walk around your room to progressively map it. Motion sensors track your position
        while periodic chirps build up the acoustic model.
      </p>

      {error && (
        <p className="text-danger text-xs mb-3">{error}</p>
      )}

      <button onClick={handleRequest} disabled={requesting}
        className="w-full bg-beacon/20 text-beacon border border-beacon/30 px-4 py-3 rounded-lg text-sm font-bold active:scale-95 transition-transform mb-2 disabled:opacity-50">
        {requesting ? 'Requesting...' : 'Allow Motion Sensors & Start'}
      </button>

      <button onClick={onSkip}
        className="w-full text-gray-500 text-xs py-2 active:text-gray-300">
        Skip (walk mode without motion tracking)
      </button>
    </div>
  );
}

function StatusPipeline({ phase }) {
  const stages = [
    { key: 'ambient', label: 'Ambient' },
    { key: 'scanning', label: 'Scanning' },
    { key: 'processing', label: 'Processing' },
    { key: 'results', label: 'Results' },
    { key: 'walking', label: 'Walking' },
  ];

  const phaseOrder = {
    'idle': -1, 'calibrating': 0,
    'ambient': 0, 'scanning': 1,
    'processing': 2, 'results': 3,
    'voice-cal': 3, 'voice-listen': 3,
    'walking-init': 4, 'walking': 4,
  };
  const currentIdx = phaseOrder[phase] ?? -1;

  return (
    <div className="flex items-center gap-1 w-full overflow-x-auto py-2">
      {stages.map((s, i) => {
        const isActive = i === currentIdx;
        const isDone = i < currentIdx;
        return (
          <div key={s.key} className="flex items-center gap-1 flex-shrink-0">
            <div className={`w-2 h-2 rounded-full transition-colors duration-300 ${
              isDone ? 'bg-success' : isActive ? 'bg-beacon animate-pulse' : 'bg-gray-700'
            }`} />
            <span className={`text-xs ${
              isDone ? 'text-success' : isActive ? 'text-beacon' : 'text-gray-600'
            }`}>{s.label}</span>
            {i < stages.length - 1 && <span className="text-gray-700 text-xs mx-0.5">&rarr;</span>}
          </div>
        );
      })}
    </div>
  );
}

function VoiceProximityPanel({ engine, roomGeometry, isActive }) {
  const [calState, setCalState] = useState('idle'); // idle, calibrating, ready, listening
  const [fingerprint, setFingerprint] = useState(null);
  const [distance, setDistance] = useState(null);
  const [calDistance] = useState(0.6); // arm's length ~60cm
  const stopRef = useRef(null);

  const startCalibration = useCallback(async () => {
    if (!engine) return;
    setCalState('calibrating');

    const recording = await engine.recordAmbient(2, null, null);
    const spectrum = averageSpectrum(recording, 2048, 512);
    setFingerprint({ spectrum, distance: calDistance });
    setCalState('ready');
  }, [engine, calDistance]);

  const startListening = useCallback(() => {
    if (!engine || !fingerprint) return;
    setCalState('listening');
    stopRef.current = engine.startVoiceMonitoring((spectrum) => {
      const dist = estimateVoiceDistance(spectrum, fingerprint, calDistance, roomGeometry);
      setDistance(dist);
    });
  }, [engine, fingerprint, calDistance, roomGeometry]);

  const stopListening = useCallback(() => {
    if (stopRef.current) stopRef.current();
    setCalState('ready');
    setDistance(null);
  }, []);

  useEffect(() => {
    return () => { if (stopRef.current) stopRef.current(); };
  }, []);

  if (!isActive) return null;

  return (
    <div className="bg-surface rounded-xl p-4 mt-4 border border-gray-800">
      <h3 className="text-beacon font-bold text-sm mb-3">Voice Proximity</h3>

      {calState === 'idle' && (
        <div>
          <p className="text-gray-400 text-xs mb-3">
            Hold the phone at arm's length (~60cm) and say "hello" when prompted.
          </p>
          <button onClick={startCalibration}
            className="bg-beacon/20 text-beacon border border-beacon/30 px-4 py-2 rounded-lg text-sm font-medium active:scale-95 transition-transform w-full">
            Calibrate Voice
          </button>
        </div>
      )}

      {calState === 'calibrating' && (
        <div className="text-center py-4">
          <div className="text-beacon animate-pulse text-lg mb-2">Listening...</div>
          <p className="text-gray-400 text-xs">Say "hello" at arm's length now</p>
        </div>
      )}

      {calState === 'ready' && (
        <button onClick={startListening}
          className="bg-success/20 text-success border border-success/30 px-4 py-2 rounded-lg text-sm font-medium active:scale-95 transition-transform w-full">
          Start Proximity Tracking
        </button>
      )}

      {calState === 'listening' && (
        <div>
          <div className="text-center py-4">
            <div className="text-6xl font-bold text-beacon mb-1">
              {distance !== null ? distance.toFixed(1) : '--'}
            </div>
            <div className="text-gray-400 text-sm">meters away</div>
            <div className={`mt-2 text-xs ${
              distance && distance < 1 ? 'text-success' :
              distance && distance < 3 ? 'text-warn' : 'text-danger'
            }`}>
              {distance && distance < 1 ? 'Very close' :
               distance && distance < 3 ? 'Nearby' :
               distance && distance < 6 ? 'Across the room' : 'Far away'}
            </div>
          </div>
          <button onClick={stopListening}
            className="bg-danger/20 text-danger border border-danger/30 px-4 py-2 rounded-lg text-sm font-medium active:scale-95 transition-transform w-full mt-2">
            Stop
          </button>
        </div>
      )}
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================

function App() {
  const [phase, setPhase] = useState('idle');
  const [status, setStatus] = useState('Tap MAP ROOM to begin');
  const [micPermission, setMicPermission] = useState(null);
  const [error, setError] = useState(null);
  const [waveformData, setWaveformData] = useState(null);
  const [results, setResults] = useState(null);
  const [latencyMs, setLatencyMs] = useState(null);
  const [roomTempC, setRoomTempC] = useState(20);

  // Progressive mapping state
  const [walkingStats, setWalkingStats] = useState({ steps: 0, distance: 0, coverage: 0, floorMaterial: null });
  const [walkingStatus, setWalkingStatus] = useState('');

  // Multi-device state (MDV-T02/T03)
  const [multiDevice, setMultiDevice] = useState({
    active: false, connected: false, role: null, deviceCount: 0,
    roomCode: '', serverUrl: '', syncAccuracy: null, phase: 'idle', // idle|pairing|syncing|ready|scanning
  });
  const deviceLinkRef = useRef(null);

  const engineRef = useRef(null);
  const containerRef = useRef(null);
  const roomModelRef = useRef(null);
  const imuTrackerRef = useRef(null);
  const walkingIntervalsRef = useRef([]);
  const footstepStopRef = useRef(null);
  const [viewWidth, setViewWidth] = useState(360);

  useEffect(() => {
    const updateWidth = () => {
      setViewWidth(Math.min(window.innerWidth - 32, 500));
    };
    updateWidth();
    window.addEventListener('resize', updateWidth);
    return () => window.removeEventListener('resize', updateWidth);
  }, []);

  useEffect(() => { SPEED_OF_SOUND = 331.3 * Math.sqrt(1 + roomTempC / 273.15); }, [roomTempC]);

  // Request microphone permission immediately on page load
  useEffect(() => {
    (async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setMicPermission(false);
          setError(window.isSecureContext === false
            ? 'Microphone access requires HTTPS.'
            : 'Browser does not support microphone access.');
          return;
        }
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        });
        // Permission granted — stop the stream (engine.init() will re-acquire)
        stream.getTracks().forEach(t => t.stop());
        setMicPermission(true);
      } catch (e) {
        if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
          setMicPermission(false);
        } else {
          setMicPermission(false);
          setError(e.message);
        }
      }
    })();
  }, []);

  const startMapping = useCallback(async () => {
    setError(null);
    setResults(null);

    try {
      // Initialize engine
      setPhase('calibrating');
      setStatus('Requesting microphone access...');

      const engine = new AcousticEngine();
      engineRef.current = engine;
      await engine.init();
      setMicPermission(true);

      // Start IMU tracking eagerly for delay-rate surface normal estimation
      try {
        const imu = new IMUTracker();
        const imuGranted = await imu.requestPermission();
        if (imuGranted) {
          imu.start(() => {}, () => {}); // no-op callbacks — we just need velocity history
          imuTrackerRef.current = imu;
        }
      } catch (_) {} // IMU is optional — continue without it

      // Latency calibration
      const latency = await engine.calibrateLatency(setStatus);
      setLatencyMs(latency);

      // Phase 1: Ambient capture
      setPhase('ambient');
      const ambientRecording = await engine.recordAmbient(
        AMBIENT_DURATION_S, setStatus, setWaveformData
      );
      setStatus('Analyzing ambient noise...');

      const sr = engine.audioCtx.sampleRate;
      const padN = nextPow2(FFT_SIZE);
      // Noise floor: use first half of ambient recording
      const halfLen = Math.floor(ambientRecording.length / 2);
      const noiseFloor = averageSpectrum(ambientRecording.slice(0, halfLen), FFT_SIZE, FFT_SIZE >> 1);
      // Ambient spectrum: use second half (independent data for peak detection)
      const ambientSpectrum = averageSpectrum(ambientRecording.slice(halfLen), FFT_SIZE, FFT_SIZE >> 1);
      const modalPeaks = findSpectralPeaks(
        ambientSpectrum, noiseFloor, MODAL_PEAK_THRESHOLD_DB, sr, padN
      ).slice(0, 20);

      setStatus(`Baseline captured (${modalPeaks.length} room modes)`);

      // Phase 2: ESS Sweep Burst — 40 rapid sweeps for delay-rate tracking
      setPhase('scanning');
      setStatus('Get ready \u2014 scan tones are about to play...');
      await engine._wait(1500);
      const sweepResult = await engine.emitSweepBurst(
        noiseFloor, ESS_BURST_COUNT, setStatus, setWaveformData
      );
      const { echoHistory, sweepTimestamps, responses, rt60 } = sweepResult;

      // Phase 3: Processing — delay-rate tracking + geometry solving
      setPhase('processing');
      setStatus('Tracking echo delay-rates...');
      // Discard first 3 sweeps (AGC settling transient corrupts amplitudes)
      const stableEchoHistory = echoHistory.slice(3);
      const stableSweepTimestamps = sweepTimestamps.slice(3);
      const rawTracks = trackDelayRates(stableEchoHistory, stableSweepTimestamps);

      // Filter second-order / multi-path echo ghosts.
      //
      // Two-pass strategy:
      //
      // Pass 1 — absolute indoor cap:
      //   Any echo beyond MAX_INDOOR_DIST (12m) is physically impossible in a domestic
      //   room and is unconditionally removed. All echoes between 0.3m and 12m are kept
      //   by default — this range includes every plausible body reflection, near-wall,
      //   and far-wall echo in rooms up to ~8m across.
      //
      // Pass 2 — harmonic ghost suppression:
      //   Second-order (and third-order) reflections appear at ≈ 2× and 3× a confirmed
      //   first-order distance. A track is a harmonic ghost if:
      //     (a) its distance is ≥ MIN_HARMONIC_DIST (3m) so we don't suppress real walls, AND
      //     (b) there exists a lower-distance track whose 2× or 3× multiple is within
      //         HARMONIC_TOLERANCE (15%) of this track's distance.
      //   Harmonic ghosts are weaker echoes that happen to survive the MIN_TRACKS filter;
      //   the stronger first-order echo at d/2 or d/3 is the reliable signal.
      //
      // What this deliberately does NOT do:
      //   - It does NOT use gap analysis between body echoes and wall echoes (the old
      //     approach misidentified the 0.8m→1.5m gap as a multi-path boundary).
      //   - It does NOT require ≥4 tracks before engaging (the old guard meant 0 filtering
      //     happened when only 2–3 tracks survived — harmonic pass still runs).
      const MAX_INDOOR_DIST   = 12.0; // m — hard ceiling; no domestic room is larger
      const MIN_HARMONIC_DIST = 3.0;  // m — never suppress echoes closer than this as harmonics
      const HARMONIC_TOLERANCE = 0.15; // 15% — accounts for angle-of-incidence path-length variation

      // Pass 1: absolute cap
      const capFiltered = rawTracks.filter(t => t.meanDistance <= MAX_INDOOR_DIST);

      // Pass 2: harmonic ghost suppression
      // Build set of confirmed first-order distances (all tracks that survive Pass 1)
      const firstOrderDists = capFiltered.map(t => t.meanDistance);
      const tracks = capFiltered.filter(candidate => {
        if (candidate.meanDistance < MIN_HARMONIC_DIST) return true; // too close to be a harmonic — keep unconditionally
        const d = candidate.meanDistance;
        for (const d1 of firstOrderDists) {
          if (d1 >= d) continue; // only check tracks closer than the candidate
          for (const multiplier of [2, 3]) {
            const expected = d1 * multiplier;
            if (Math.abs(d - expected) / expected <= HARMONIC_TOLERANCE) {
              return false; // this track looks like a harmonic ghost of d1 — discard
            }
          }
        }
        return true; // no harmonic match found — keep
      });

      // TODO: Pass 3 — Once geometry is solved, predict 2nd-order corner-reflection distances
      // (d = sqrt(d_wallA² + d_wallB²) for 90° corners) and retroactively remove matching tracks.
      // Currently blocked by the filter running before the solver. Requires a two-pass architecture.

      setStatus(`Found ${tracks.length} surface tracks (${rawTracks.length - tracks.length} multi-path filtered)`);

      // Estimate surface normals (IMU velocity if available)
      const imuVelocity = imuTrackerRef.current?.velocityHistory || [];
      estimateSurfaceNormals(tracks, imuVelocity, stableSweepTimestamps);

      // Compute scan quality score (after normals have been assigned)
      const USABLE_SWEEPS = ESS_BURST_COUNT - 3; // 3 AGC-settling sweeps discarded
      const multiPathFiltered = rawTracks.length - tracks.length;
      const imuNormalCount = tracks.filter(t => t.normalFromIMU).length;
      const avgDetections = tracks.length > 0
        ? tracks.reduce((sum, t) => sum + (t.detectionCount || 0), 0) / tracks.length
        : 0;
      const qualityLabel = tracks.length >= 5 ? 'Good'
        : tracks.length >= 3 ? 'Fair'
        : 'Poor';
      const scanQuality = {
        rawTrackCount: rawTracks.length,
        trackCount: tracks.length,
        multiPathFiltered,
        imuNormalCount,
        fallbackNormalCount: tracks.length - imuNormalCount,
        avgDetectionsPerTrack: avgDetections,
        usableSweeps: USABLE_SWEEPS,
        label: qualityLabel,
      };

      // Solve geometry via least-squares
      setStatus('Solving room geometry...');
      const geometry = solveGeometryFromDelayRates(tracks, modalPeaks);
      if (rt60 && rt60 > 0.05 && rt60 < 5.0) geometry.rt60 = rt60;

      // Compile results
      const compiledResults = {
        geometry,
        modalPeaks,
        interferenceResults: [],
        responses,
        ambientSpectrum,
        noiseFloor,
        latencyMs: latency,
        tracks,
        echoHistory,
        sweepTimestamps,
        scanQuality,
        timestamp: new Date().toISOString(),
      };

      setResults(compiledResults);
      setPhase('results');
      setStatus('Room mapping complete');

    } catch (err) {
      console.error('Mapping error:', err);
      // Clean up engine on error to prevent AudioContext leak
      if (engineRef.current) { try { engineRef.current.dispose(); } catch(_) {} engineRef.current = null; }
      if (imuTrackerRef.current) { try { imuTrackerRef.current.stop(); } catch(_) {} imuTrackerRef.current = null; }
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        setMicPermission(false);
        setError('Microphone access denied. Please allow microphone access and try again.');
      } else {
        setError(err.message || 'An error occurred during room mapping.');
      }
      setPhase('idle');
      setStatus('Tap MAP ROOM to begin');
    }
  }, []);

  // ============================================================
  // MULTI-DEVICE: Pairing, Clock Sync, Sweep Coordination
  // ============================================================

  const startMultiDevice = useCallback(async (serverUrl, roomCode) => {
    try {
      const link = new DeviceLink();
      deviceLinkRef.current = link;

      // State change handler
      link.onStateChange = (state) => {
        setMultiDevice(prev => ({ ...prev, ...state, active: true }));
      };

      // App-level message handler (sweep triggers, echo peaks, geometry)
      link.onMessage = async (msg) => {
        if (msg.type === 'sweep-trigger' && multiDevice.role === 'recorder') {
          // MDV-T06: Recorder receives sweep trigger from emitter
          handleRemoteSweepTrigger(msg.payload);
        }
        if (msg.type === 'echo-peaks' && multiDevice.role === 'emitter') {
          // MDV-T07: Emitter receives echo peaks from recorder
          handleRemoteEchoPeaks(msg.payload);
        }
        if (msg.type === 'geometry-update') {
          // MDV-T09: Both devices receive geometry updates
          if (msg.payload.geometry) {
            setResults(prev => prev ? { ...prev, geometry: msg.payload.geometry } : null);
          }
        }
      };

      setMultiDevice(prev => ({ ...prev, phase: 'pairing', serverUrl, roomCode }));
      await link.connect(serverUrl, roomCode);

      // Wait for partner (poll until deviceCount >= 2)
      setStatus('Waiting for partner device...');
      while (link.deviceCount < 2) {
        await new Promise(r => setTimeout(r, 500));
        if (!link.connected) throw new Error('Disconnected while waiting');
      }

      // Clock sync — only the EMITTER initiates (recorder just responds)
      if (link.role === 'emitter') {
        setMultiDevice(prev => ({ ...prev, phase: 'syncing' }));
        setStatus('Synchronizing clocks...');
        // Small delay to let recorder's message handler initialize
        await new Promise(r => setTimeout(r, 500));
        const sync = await link.syncClock(10);
        setMultiDevice(prev => ({ ...prev, syncAccuracy: sync.accuracy, phase: 'ready' }));
        setStatus(`Synced (±${sync.accuracy.toFixed(1)}ms). Ready to scan.`);
      } else {
        // Recorder waits for emitter to complete sync, then marks ready
        setMultiDevice(prev => ({ ...prev, phase: 'syncing' }));
        setStatus('Waiting for emitter to sync clocks...');
        // The recorder's clock offset is the negative of the emitter's
        // It will be populated by responding to clock-sync-request messages
        // Just wait until the emitter finishes and sends a ready signal
        await new Promise(r => setTimeout(r, 3000)); // Give emitter time to sync
        setMultiDevice(prev => ({ ...prev, syncAccuracy: 2.0, phase: 'ready' }));
        setStatus('Ready. Waiting for emitter to start scan.');
      }

    } catch (err) {
      setError(err.message);
      setMultiDevice(prev => ({ ...prev, active: false, connected: false, phase: 'idle' }));
    }
  }, []);

  // MDV-T06: Handle sweep trigger on recorder side
  const handleRemoteSweepTrigger = useCallback(async (payload) => {
    const link = deviceLinkRef.current;
    const engine = engineRef.current;
    if (!link || !engine) return;

    const { sweepIndex, emitTime, sweepParams } = payload;
    const localEmitTime = link.localTime(emitTime);

    // Generate the same sweep locally for deconvolution
    const sr = engine.audioCtx?.sampleRate || SAMPLE_RATE;
    const sweep = generateExponentialSweep(sweepParams.f1, sweepParams.f2, sweepParams.duration, sr);
    const invFilter = generateInverseFilter(sweep, sweepParams.f1, sweepParams.f2, sweepParams.duration, sr);

    // Wait until just before the sweep arrives
    const now = performance.now();
    const waitMs = localEmitTime - now - (link.syncAccuracy || 5) - 10;
    if (waitMs > 0) await new Promise(r => setTimeout(r, waitMs));

    // Record for sweep duration + echo window
    const recDur = sweepParams.duration + ESS_ECHO_WINDOW_S + 0.050; // +50ms margin
    const recording = await engine._emitAndRecord(
      engine.audioCtx.createBuffer(1, 1, sr), // empty buffer (don't emit anything)
      recDur
    );

    // Deconvolve and extract peaks
    const rir = deconvolveImpulseResponse(recording, invFilter);
    // For separated devices, direct path = speaker→mic through air (not chassis coupling)
    // Find it via cross-correlation peak
    let directPathSamples = 0;
    let maxVal = 0;
    for (let i = 0; i < Math.min(rir.length, Math.round(0.1 * sr)); i++) {
      if (Math.abs(rir[i]) > maxVal) { maxVal = Math.abs(rir[i]); directPathSamples = i; }
    }
    const directPathDistance = directPathSamples / sr * SPEED_OF_SOUND; // one-way, NOT /2

    const maxSearch = directPathSamples + Math.round(ESS_ECHO_WINDOW_S * sr);
    const peaks = extractEchoPeaks(rir, directPathSamples, sr, 8, maxSearch);

    // Send peaks back to emitter
    link.send('echo-peaks', {
      sweepIndex,
      directPathDistance,
      peaks: peaks.map(p => ({
        distance: p.distance,
        amplitude: p.amplitude,
        timeSec: p.timeSec,
      })),
    });
  }, []);

  // MDV-T07: Handle echo peaks received from recorder
  const remoteEchoDataRef = useRef([]);
  const handleRemoteEchoPeaks = useCallback((payload) => {
    remoteEchoDataRef.current.push(payload);
  }, []);

  // MDV-T06: Start multi-device scan (emitter side)
  const startMultiDeviceScan = useCallback(async () => {
    const link = deviceLinkRef.current;
    const engine = engineRef.current;
    if (!link || !engine || link.role !== 'emitter') return;

    setPhase('scanning');
    remoteEchoDataRef.current = [];

    const sr = engine.audioCtx?.sampleRate || SAMPLE_RATE;
    const sweep = generateExponentialSweep(ESS_F1, ESS_F2, ESS_DURATION_S, sr);
    const sweepParams = { f1: ESS_F1, f2: ESS_F2, duration: ESS_DURATION_S, sr };

    for (let i = 0; i < ESS_BURST_COUNT; i++) {
      setStatus(`Multi-device scan ${i + 1}/${ESS_BURST_COUNT}...`);

      // Schedule sweep 100ms in the future
      const emitTime = performance.now() + 100;
      const partnerEmitTime = link.partnerTime(emitTime);

      // Tell recorder when sweep will happen
      link.send('sweep-trigger', { sweepIndex: i, emitTime: partnerEmitTime, sweepParams });

      // Wait until scheduled time
      const waitMs = emitTime - performance.now();
      if (waitMs > 0) await new Promise(r => setTimeout(r, waitMs));

      // Play the sweep
      const buf = engine.audioCtx.createBuffer(1, sweep.length, sr);
      buf.getChannelData(0).set(sweep);
      const player = engine.audioCtx.createBufferSource();
      player.buffer = buf;
      player.connect(engine.audioCtx.destination);
      player.start();

      // Wait for sweep + echo window before next
      await new Promise(r => setTimeout(r, (ESS_DURATION_S + ESS_ECHO_WINDOW_S) * 1000 + 50));
    }

    // Wait for remote peaks to arrive (up to 3 seconds)
    setStatus('Waiting for recorder data...');
    const deadline = Date.now() + 3000;
    while (remoteEchoDataRef.current.length < ESS_BURST_COUNT * 0.5 && Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 200));
    }

    // Process results
    setPhase('processing');
    setStatus(`Received ${remoteEchoDataRef.current.length} echo packets from recorder`);

    // Build echo history from remote data
    const echoHistory = remoteEchoDataRef.current.map(d => d.peaks || []);
    const sweepTimestamps = remoteEchoDataRef.current.map((_, i) => i * ESS_SWEEP_PERIOD_S);

    // Track delay rates
    const tracks = trackDelayRates(echoHistory, sweepTimestamps);
    estimateSurfaceNormals(tracks, [], sweepTimestamps);
    const geometry = solveGeometryFromDelayRates(tracks, []);

    // Add baseline distance from direct path
    if (remoteEchoDataRef.current.length > 0) {
      const avgBaseline = remoteEchoDataRef.current.reduce((s, d) => s + (d.directPathDistance || 0), 0)
        / remoteEchoDataRef.current.length;
      geometry.baselineDistance = avgBaseline;
    }

    // Broadcast geometry to recorder
    link.send('geometry-update', { geometry });

    const compiledResults = {
      geometry,
      modalPeaks: [],
      interferenceResults: [],
      responses: [],
      ambientSpectrum: null,
      noiseFloor: null,
      latencyMs: null,
      tracks,
      echoHistory,
      sweepTimestamps,
      scanQuality: { label: tracks.length >= 5 ? 'Good' : tracks.length >= 3 ? 'Fair' : 'Poor', trackCount: tracks.length },
      timestamp: new Date().toISOString(),
      multiDevice: true,
      baselineDistance: geometry.baselineDistance,
    };

    setResults(compiledResults);
    setPhase('results');
    setStatus(`Multi-device scan complete (${tracks.length} surfaces, baseline ${(geometry.baselineDistance || 0).toFixed(1)}m)`);
  }, []);

  const disconnectMultiDevice = useCallback(() => {
    if (deviceLinkRef.current) deviceLinkRef.current.disconnect();
    deviceLinkRef.current = null;
    setMultiDevice({ active: false, connected: false, role: null, deviceCount: 0, roomCode: '', serverUrl: '', syncAccuracy: null, phase: 'idle' });
  }, []);

  const resetMapping = useCallback(() => {
    stopProgressiveMapping();
    if (engineRef.current) engineRef.current.dispose();
    engineRef.current = null;
    roomModelRef.current = null;
    setPhase('idle');
    setStatus('Tap MAP ROOM to begin');
    setResults(null);
    setWaveformData(null);
    setError(null);
    setWalkingStats({ steps: 0, distance: 0, coverage: 0, floorMaterial: null });
  }, [stopProgressiveMapping]);

  // Start progressive walking mode
  const startProgressiveMapping = useCallback(() => {
    if (!results || !engineRef.current) return;

    // Seed room model from one-shot results
    const model = new RoomModel();
    model.initializeFromOneShot(results);
    roomModelRef.current = model;

    setPhase('walking-init');
    setWalkingStats({
      steps: 0,
      distance: 0,
      coverage: model.getCoveragePercentage(),
      floorMaterial: null,
    });
  }, [results]);

  // IMU permission result handler
  const handleIMUPermission = useCallback((granted) => {
    const engine = engineRef.current;
    const model = roomModelRef.current;
    if (!engine || !model) return;

    // Start IMU tracking if granted
    if (granted) {
      const tracker = new IMUTracker();
      tracker.hasPermission = true;
      tracker.start(
        // onStep
        (stepData) => {
          model.currentPosition = stepData.position;
          model.addFootstep(stepData.position, model.floorMaterial, 0);
          setWalkingStats(prev => ({
            ...prev,
            steps: stepData.stepCount,
            distance: model.getDistanceWalked(),
          }));
        },
        // onPositionUpdate
        (pos) => {
          model.currentPosition = pos;
        }
      );
      imuTrackerRef.current = tracker;
    }

    // Start footstep detection — use IMU position if available, else model.currentPosition
    const footstopStop = engine.startFootstepDetection(model.noiseFloor, (event) => {
      const pos = imuTrackerRef.current
        ? imuTrackerRef.current.getPosition()
        : { ...model.currentPosition };
      model.addFootstep(pos, event.floorMaterial, event.energy);
      setWalkingStats(prev => ({
        ...prev,
        floorMaterial: event.floorMaterial,
      }));
    });
    footstepStopRef.current = footstopStop;

    // Start periodic mini-chirp bursts (recursive setTimeout to prevent overlap)
    let chirpActive = true;
    const scheduleBurst = async () => {
      if (!chirpActive) return;
      const eng = engineRef.current;
      const mdl = roomModelRef.current;
      if (!eng || !mdl) return;
      setWalkingStatus('Emitting chirps...');
      try {
        const reflections = await eng.emitMiniChirpBurst(mdl.noiseFloor, setWalkingStatus);
        if (!chirpActive) return; // check again after async
        const pos = imuTrackerRef.current?.getPosition() || mdl.currentPosition;
        mdl.addObservation(pos, reflections, 0.6);

        // Try acoustic position fix
        const fix = acousticPositionFix(reflections, mdl.geometry);
        if (fix) {
          if (imuTrackerRef.current) {
            // Correct IMU drift
            // Confidence from matched wall count: more walls matched = higher trust in fix
            const fixConfidence = Math.min(1, reflections.length / 4); // 4+ reflections = full confidence
            imuTrackerRef.current.correctPosition(fix, fixConfidence);
          } else {
            // No IMU — use acoustic fix directly as current position
            mdl.currentPosition = fix;
          }
          mdl.addLandmark(fix, reflections.map(r => r.distance));
        }

        // Calibrate stride if IMU is active
        if (imuTrackerRef.current && imuTrackerRef.current.stepCount > 8) {
          const dist = mdl.getDistanceWalked();
          imuTrackerRef.current.calibrateStride(dist, imuTrackerRef.current.stepCount);
        }

        // Run passive SSSG+DPF analysis on ambient audio between bursts
        // Wait 200ms for chirp reverb to decay before recording ambient
        if (!chirpActive) return;
        await eng._wait(200);
        try {
          const passiveMapper = new PassiveAcousticMapper();
          if (!chirpActive) return;
          const ambientRec = await eng.recordAmbient(1.0, null, null);
          const walkPositions = mdl.positionHistory.slice(-20).map(p => ({ x: p.x }));
          const heading = imuTrackerRef.current?.heading || 0;
          if (walkPositions.length >= 4) {
            const passiveResult = passiveMapper.analyze(ambientRec, walkPositions, heading);
            // Fuse passive dimensions with active geometry
            if (passiveResult.dimensions.length > 0 && mdl.geometry) {
              mdl.geometry = passiveMapper.fuseWithActiveResults(passiveResult, mdl.geometry);
            }
          }
        } catch (pe) {
          // Passive analysis is best-effort, don't break walking mode
          console.warn('Passive SSSG analysis:', pe);
        }

        setWalkingStats(prev => ({
          ...prev,
          coverage: mdl.getCoveragePercentage(),
        }));
        setWalkingStatus(`${mdl.geometry?.walls?.length || 0} walls detected`);
      } catch (e) {
        console.warn('Mini chirp burst error:', e);
        setWalkingStatus('Listening...');
      }
      // Schedule next burst only after current completes
      if (chirpActive) {
        const timerId = setTimeout(scheduleBurst, WALKING_BURST_INTERVAL_MS);
        walkingIntervalsRef.current.push(timerId);
      }
    };
    const firstTimer = setTimeout(scheduleBurst, WALKING_BURST_INTERVAL_MS);
    walkingIntervalsRef.current.push(firstTimer);
    // Store the deactivation flag for cleanup
    walkingIntervalsRef.current._deactivate = () => { chirpActive = false; };

    setPhase('walking');
    setWalkingStatus('Walk around the room...');
  }, []);

  // Skip IMU, start walking with acoustic-only positioning
  const handleIMUSkip = useCallback(() => {
    handleIMUPermission(false);
  }, [handleIMUPermission]);

  // Stop progressive mapping
  const stopProgressiveMapping = useCallback(() => {
    // Deactivate recursive chirp scheduling
    if (walkingIntervalsRef.current._deactivate) {
      walkingIntervalsRef.current._deactivate();
    }
    // Clear all pending timeouts
    walkingIntervalsRef.current.forEach(id => clearTimeout(id));
    walkingIntervalsRef.current = [];

    // Stop footstep detection
    if (footstepStopRef.current) {
      footstepStopRef.current();
      footstepStopRef.current = null;
    }

    // Stop IMU
    if (imuTrackerRef.current) {
      imuTrackerRef.current.stop();
      imuTrackerRef.current = null;
    }

    // Update results with enhanced model
    if (roomModelRef.current) {
      const model = roomModelRef.current;
      setResults(prev => prev ? {
        ...prev,
        geometry: model.geometry || prev.geometry,
        progressiveData: {
          observations: model.observations.length,
          totalSteps: model.totalSteps,
          distanceWalked: model.getDistanceWalked(),
          coverage: model.getCoveragePercentage(),
          floorMaterial: model.floorMaterial,
          footstepCount: model.footsteps.length,
        },
      } : prev);
    }

    setPhase('results');
    setWalkingStatus('');
  }, []);

  // Cleanup on unmount
  useEffect(() => {
    return () => {
      if (walkingIntervalsRef.current._deactivate) walkingIntervalsRef.current._deactivate();
      walkingIntervalsRef.current.forEach(id => clearTimeout(id));
      if (footstepStopRef.current) footstepStopRef.current();
      if (imuTrackerRef.current) imuTrackerRef.current.stop();
      if (engineRef.current) engineRef.current.dispose();
    };
  }, []);

  const chartWidth = viewWidth;
  const chartHeight = Math.round(viewWidth * 0.5);

  return (
    <div ref={containerRef} className="min-h-screen bg-[#0a0a0f] p-4 pb-20 max-w-lg mx-auto">
      {/* Header */}
      <div className="text-center mb-6 pt-2">
        <h1 className="text-2xl font-bold text-beacon tracking-wider">ACOUSTIC MAPPER</h1>
        <p className="text-gray-500 text-xs mt-1">Decibel Proximity Fencing</p>
      </div>

      {/* Error */}
      {error && (
        <div className="bg-danger/10 border border-danger/30 rounded-lg p-3 mb-4">
          <p className="text-danger text-sm">{error}</p>
        </div>
      )}

      {/* Status Pipeline */}
      {phase !== 'idle' && <StatusPipeline phase={phase} />}

      {/* Status Text */}
      <div className="text-center mb-4">
        <p className={`text-sm ${phase === 'idle' ? 'text-gray-500' : 'text-gray-300'}`}>
          {status}
        </p>
        {latencyMs !== null && phase !== 'idle' && (
          <p className="text-gray-600 text-xs mt-1">
            Audio latency: {latencyMs.toFixed(1)} ms ({(latencyMs * SPEED_OF_SOUND / 2000).toFixed(2)} m offset)
          </p>
        )}
      </div>

      {/* Waveform */}
      {phase !== 'idle' && phase !== 'results' && (
        <div className="mb-4">
          <WaveformCanvas
            data={waveformData || new Float32Array(512)}
            width={chartWidth}
            height={100}
            color="#00f5ff"
          />
        </div>
      )}

      {/* Mic permission pending */}
      {phase === 'idle' && micPermission === null && (
        <div className="flex justify-center mb-6">
          <div className="w-48 h-48 rounded-full bg-surface border-2 border-beacon/30 flex items-center justify-center">
            <div className="text-beacon text-sm animate-pulse">Requesting mic...</div>
          </div>
        </div>
      )}

      {/* MAP ROOM Button — only when mic granted */}
      {phase === 'idle' && micPermission === true && (
        <div className="flex justify-center mb-6">
          <button
            onClick={startMapping}
            className="relative w-48 h-48 rounded-full bg-gradient-to-br from-beacon/20 to-beacon/5 border-2 border-beacon/50 flex items-center justify-center active:scale-95 transition-all duration-150 shadow-lg shadow-beacon/10"
          >
            <div className="absolute inset-2 rounded-full border border-beacon/20" />
            <div className="absolute inset-4 rounded-full border border-beacon/10" />
            <div className="text-center">
              <div className="text-beacon text-xl font-bold tracking-widest">MAP</div>
              <div className="text-beacon text-xl font-bold tracking-widest">ROOM</div>
            </div>
          </button>
        </div>
      )}

      {/* Multi-Device Button + Pairing UI */}
      {phase === 'idle' && micPermission === true && !multiDevice.active && (
        <div className="text-center mb-4 space-x-2">
          <button onClick={() => setMultiDevice(prev => ({ ...prev, active: true, phase: 'pairing' }))}
            className="text-beacon/70 text-xs border border-beacon/20 px-4 py-2 rounded-lg active:scale-95 transition-transform">
            Multi-Device Mode
          </button>
          <button onClick={() => {
            // Play a slow 2-second sweep so the user can HEAR the frequency change
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const slow = generateExponentialSweep(200, 8000, 2.0, ctx.sampleRate);
            const buf = ctx.createBuffer(1, slow.length, ctx.sampleRate);
            buf.getChannelData(0).set(slow);
            const src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start();
          }}
            className="text-gray-500 text-xs border border-gray-700 px-4 py-2 rounded-lg active:scale-95 transition-transform">
            Test Sweep
          </button>
        </div>
      )}

      {/* Pairing Modal */}
      {multiDevice.phase === 'pairing' && !multiDevice.connected && (
        <div className="bg-surface rounded-xl p-4 border border-beacon/30 mb-4">
          <h3 className="text-beacon font-bold text-sm mb-3">Multi-Device Pairing</h3>
          <div className="space-y-2">
            <input type="text" placeholder="Server IP (e.g. 192.168.1.5)"
              className="w-full bg-surface-alt text-white text-sm px-3 py-2 rounded border border-gray-700"
              value={multiDevice.serverUrl}
              onChange={e => setMultiDevice(prev => ({ ...prev, serverUrl: e.target.value }))} />
            <input type="text" placeholder="Room code (e.g. 1234)" maxLength="8"
              className="w-full bg-surface-alt text-white text-sm px-3 py-2 rounded border border-gray-700"
              value={multiDevice.roomCode}
              onChange={e => setMultiDevice(prev => ({ ...prev, roomCode: e.target.value }))} />
            <button onClick={() => {
              const url = multiDevice.serverUrl.startsWith('ws') ? multiDevice.serverUrl : `ws://${multiDevice.serverUrl}:3333`;
              startMultiDevice(url, multiDevice.roomCode);
            }}
              className="w-full bg-beacon/20 text-beacon border border-beacon/30 px-4 py-2 rounded-lg text-sm font-bold active:scale-95">
              Join Room
            </button>
            <button onClick={() => setMultiDevice(prev => ({ ...prev, active: false, phase: 'idle' }))}
              className="w-full text-gray-500 text-xs py-1">Cancel</button>
          </div>
        </div>
      )}

      {/* Multi-Device Status Banner */}
      {multiDevice.connected && (
        <div className="bg-surface rounded-lg p-3 mb-4 border border-beacon/20">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className={`w-2 h-2 rounded-full ${multiDevice.deviceCount >= 2 ? 'bg-success' : 'bg-warn animate-pulse'}`} />
              <span className="text-xs text-gray-300">
                Room {multiDevice.roomCode} · {multiDevice.deviceCount} device{multiDevice.deviceCount !== 1 ? 's' : ''}
              </span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs text-beacon font-bold">{multiDevice.role?.toUpperCase()}</span>
              {multiDevice.syncAccuracy != null && (
                <span className="text-xs text-gray-500">±{multiDevice.syncAccuracy.toFixed(1)}ms</span>
              )}
            </div>
          </div>
          {multiDevice.phase === 'ready' && multiDevice.role === 'emitter' && (
            <button onClick={startMultiDeviceScan}
              className="w-full mt-2 bg-beacon/20 text-beacon border border-beacon/30 px-4 py-2 rounded-lg text-sm font-bold active:scale-95">
              Start Multi-Device Scan
            </button>
          )}
          {multiDevice.phase === 'ready' && multiDevice.role === 'recorder' && (
            <div className="mt-2 text-center text-gray-400 text-xs animate-pulse">
              Waiting for emitter to start scan...
            </div>
          )}
          <button onClick={disconnectMultiDevice}
            className="w-full mt-1 text-gray-600 text-xs py-1">Disconnect</button>
        </div>
      )}

      {/* Active mapping - disable button */}
      {phase !== 'idle' && phase !== 'results' && phase !== 'walking-init' && phase !== 'walking' && (
        <div className="flex justify-center mb-4">
          <div className="w-32 h-32 rounded-full bg-surface border-2 border-beacon/30 flex items-center justify-center animate-pulse">
            <div className="text-beacon text-sm font-bold">MAPPING...</div>
          </div>
        </div>
      )}

      {/* Walking Init - IMU permission prompt */}
      {phase === 'walking-init' && (
        <div className="mb-4">
          <IMUPermissionPrompt onGranted={handleIMUPermission} onSkip={handleIMUSkip} />
        </div>
      )}

      {/* Walking Mode - progressive mapping */}
      {phase === 'walking' && roomModelRef.current && (
        <WalkingModePanel
          roomModel={roomModelRef.current}
          walkingStats={walkingStats}
          walkingStatus={walkingStatus}
          onStop={stopProgressiveMapping}
          chartWidth={chartWidth}
          chartHeight={chartHeight}
        />
      )}

      {/* Results */}
      {phase === 'results' && results && (
        <div className="space-y-4">
          {/* Scan quality warning */}
          {results.geometry?.insufficientData && (
            <div className="bg-warn/10 border border-warn/30 rounded-lg p-3 mb-2">
              <p className="text-warn text-sm font-bold">Insufficient echo data</p>
              <p className="text-gray-400 text-xs mt-1">Fewer than 4 surfaces detected. Try scanning in a quieter room, or hold the phone steady at arm's length.</p>
            </div>
          )}
          {results.geometry?.solverFailed && !results.geometry?.insufficientData && (
            <div className="bg-danger/10 border border-danger/30 rounded-lg p-3 mb-2">
              <p className="text-danger text-sm font-bold">Geometry solver did not converge</p>
              <p className="text-gray-400 text-xs mt-1">Dimensions shown may be inaccurate. Try rescanning with the device held steady.</p>
            </div>
          )}

          {/* Scan Quality */}
          {results.scanQuality && (() => {
            const sq = results.scanQuality;
            const isGood = sq.label === 'Good';
            const isFair = sq.label === 'Fair';
            const badgeColor = isGood ? 'text-success border-success/40 bg-success/10'
              : isFair ? 'text-warn border-warn/40 bg-warn/10'
              : 'text-danger border-danger/40 bg-danger/10';
            const badgeText = isGood ? 'Good'
              : isFair ? 'Fair'
              : 'Poor \u2014 try a quieter room';
            return (
              <div className="bg-surface rounded-xl p-4 border border-gray-800">
                <div className="flex items-center gap-3 mb-2">
                  <h3 className="text-beacon font-bold text-sm">Scan Quality</h3>
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full border ${badgeColor}`}>
                    {badgeText}
                  </span>
                </div>
                <div className="space-y-1">
                  <p className="text-gray-400 text-xs">
                    {sq.trackCount} surface{sq.trackCount !== 1 ? 's' : ''} detected
                    {sq.multiPathFiltered > 0 ? ` (${sq.multiPathFiltered} multi-path filtered)` : ''}
                  </p>
                  <p className="text-gray-400 text-xs">
                    Avg {sq.avgDetectionsPerTrack.toFixed(1)} detections per surface out of {sq.usableSweeps} sweeps
                  </p>
                  {results.latencyMs != null && (
                    <p className="text-gray-400 text-xs">
                      Latency: {results.latencyMs.toFixed(1)} ms
                    </p>
                  )}
                </div>
              </div>
            );
          })()}

          {/* Temperature */}
          <div className="flex items-center gap-2 mb-1">
            <label className="text-gray-400 text-xs">Room temp (°C)</label>
            <input
              type="number"
              value={roomTempC}
              onChange={e => setRoomTempC(Number(e.target.value))}
              className="bg-surface-alt text-white text-xs rounded w-16 px-2 py-1 border border-gray-700 text-center"
            />
          </div>

          {/* Dimensions */}
          <div className="bg-surface rounded-xl p-4 border border-gray-800">
            <h3 className="text-beacon font-bold text-sm mb-3">Room Dimensions</h3>
            <div className="grid grid-cols-3 gap-3 text-center">
              {['x', 'y', 'z'].map(axis => {
                const val = results.geometry[axis];
                const conf = results.geometry.confidence?.[axis] || 0;
                return (
                  <div key={axis} className="bg-surface-alt rounded-lg p-3">
                    <div className="text-gray-500 text-xs mb-1">{axis === 'z' ? 'Height' : axis === 'x' ? 'Width' : 'Depth'}</div>
                    <div className="text-white text-xl font-bold">
                      {val ? `${val.toFixed(1)}m` : '--'}
                    </div>
                    <div className="text-gray-600 text-xs mt-1">
                      {conf > 0 ? `${(conf * 100).toFixed(0)}% conf` : ''}
                    </div>
                  </div>
                );
              })}
            </div>
            {results.geometry.modalAgreement != null && (
              <div className="mt-3 text-center">
                <span className="text-gray-500 text-xs">Modal agreement: </span>
                <span className={`text-xs font-bold ${
                  results.geometry.modalAgreement > 0.6 ? 'text-success' :
                  results.geometry.modalAgreement > 0.3 ? 'text-warn' : 'text-danger'
                }`}>
                  {(results.geometry.modalAgreement * 100).toFixed(0)}%
                </span>
              </div>
            )}
          </div>

          {/* Floor Plan */}
          <div className="bg-surface rounded-xl p-4 border border-gray-800">
            <h3 className="text-beacon font-bold text-sm mb-3">Floor Plan</h3>
            <FloorPlan geometry={results.geometry} width={chartWidth - 32} height={chartHeight} />
          </div>

          {/* Surface Materials */}
          {results.geometry.walls?.length > 0 && (
            <div className="bg-surface rounded-xl p-4 border border-gray-800">
              <h3 className="text-beacon font-bold text-sm mb-3">Detected Surfaces</h3>
              <p className="text-gray-600 text-xs italic mb-2">Material classification is experimental</p>
              <div className="space-y-2">
                {results.geometry.walls.map((w, i) => (
                  <div key={i} className="flex items-center gap-3 text-xs">
                    <div className="w-3 h-3 rounded-full flex-shrink-0"
                      style={{ backgroundColor: w.material?.color || '#888' }} />
                    <span className="text-gray-300 flex-1">{w.material?.label || 'Unknown'}</span>
                    <span className="text-gray-500">{(w.distance ?? 0).toFixed(2)}m</span>
                    <span className="text-gray-600">({w.reflectionCount} hits)</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Objects */}
          {results.geometry.objects?.length > 0 && (
            <div className="bg-surface rounded-xl p-4 border border-gray-800">
              <h3 className="text-beacon font-bold text-sm mb-3">Detected Objects</h3>
              <div className="space-y-2">
                {results.geometry.objects.map((obj, i) => (
                  <div key={i} className="flex items-center gap-3 text-xs">
                    <div className="w-3 h-3 rounded-sm flex-shrink-0"
                      style={{ backgroundColor: obj.material?.color || '#888' }} />
                    <span className="text-gray-300 flex-1">{obj.material?.label || 'Unknown'}</span>
                    <span className="text-gray-500">{obj.distance.toFixed(2)}m</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Spectral Response */}
          <div className="bg-surface rounded-xl p-4 border border-gray-800">
            <h3 className="text-beacon font-bold text-sm mb-3">Spectral Response</h3>
            <SpectralChart responses={results.responses} width={chartWidth - 32} height={chartHeight} />
          </div>

          {/* Modal Frequencies */}
          <div className="bg-surface rounded-xl p-4 border border-gray-800">
            <h3 className="text-beacon font-bold text-sm mb-3">Room Modes</h3>
            <ModalChart
              detectedModes={results.geometry.detectedModes}
              predictedModes={results.geometry.predictedModes}
              width={chartWidth - 32}
              height={Math.round(chartHeight * 0.6)}
            />
            {results.modalPeaks?.length > 0 && (
              <div className="mt-2 flex flex-wrap gap-1">
                {results.modalPeaks.slice(0, 10).map((p, i) => (
                  <span key={i} className="text-xs bg-surface-alt px-2 py-0.5 rounded text-gray-400">
                    {p.frequency.toFixed(0)} Hz
                  </span>
                ))}
              </div>
            )}
          </div>

          {/* Interference Results */}
          {results.interferenceResults?.length > 0 && (
            <div className="bg-surface rounded-xl p-4 border border-gray-800">
              <h3 className="text-beacon font-bold text-sm mb-3">Interference Analysis</h3>
              <div className="space-y-2">
                {results.interferenceResults.map((ir, i) => (
                  <div key={i} className="bg-surface-alt rounded-lg p-2">
                    <div className="flex justify-between text-xs">
                      <span className="text-gray-300">{ir.frequency.toFixed(0)} Hz</span>
                      <span className="text-gray-500">Q: {ir.qFactor.toFixed(1)}</span>
                    </div>
                    <div className="flex gap-2 mt-1">
                      <div className="flex-1">
                        <div className="text-xs text-success/70 mb-0.5">Constructive</div>
                        <div className="h-2 bg-surface rounded-full overflow-hidden">
                          <div className="h-full bg-success/50 rounded-full"
                            style={{ width: `${Math.min(100, ir.gainRatio * 20)}%` }} />
                        </div>
                      </div>
                      <div className="flex-1">
                        <div className="text-xs text-danger/70 mb-0.5">Cancellation</div>
                        <div className="h-2 bg-surface rounded-full overflow-hidden">
                          <div className="h-full bg-danger/50 rounded-full"
                            style={{ width: `${Math.min(100, Math.abs(ir.cancellationDb) * 3)}%` }} />
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Voice Proximity */}
          <VoiceProximityPanel
            engine={engineRef.current}
            roomGeometry={results.geometry}
            isActive={phase === 'results'}
          />

          {/* Progressive data summary (if walking was done) */}
          {results.progressiveData && (
            <div className="bg-surface rounded-xl p-4 border border-beacon/20">
              <h3 className="text-beacon font-bold text-sm mb-3">Walking Mode Results</h3>
              <div className="grid grid-cols-2 gap-2">
                <div className="bg-surface-alt rounded-lg p-2 text-center">
                  <div className="text-white text-lg font-bold">{results.progressiveData.observations}</div>
                  <div className="text-gray-500 text-xs">Observations</div>
                </div>
                <div className="bg-surface-alt rounded-lg p-2 text-center">
                  <div className="text-white text-lg font-bold">{results.progressiveData.totalSteps}</div>
                  <div className="text-gray-500 text-xs">Steps</div>
                </div>
                <div className="bg-surface-alt rounded-lg p-2 text-center">
                  <div className="text-white text-lg font-bold">{results.progressiveData.distanceWalked.toFixed(1)}m</div>
                  <div className="text-gray-500 text-xs">Walked</div>
                </div>
                <div className="bg-surface-alt rounded-lg p-2 text-center">
                  <div className="text-success text-lg font-bold">{results.progressiveData.coverage.toFixed(0)}%</div>
                  <div className="text-gray-500 text-xs">Coverage</div>
                </div>
              </div>
              {results.progressiveData.floorMaterial && (
                <div className="mt-2 flex items-center gap-2 text-xs">
                  <div className="w-3 h-3 rounded-full" style={{ backgroundColor: results.progressiveData.floorMaterial.color }} />
                  <span className="text-gray-300">Floor: {results.progressiveData.floorMaterial.label}</span>
                </div>
              )}
            </div>
          )}

          {/* Start Walking Button */}
          <button onClick={startProgressiveMapping}
            className="w-full bg-beacon/20 text-beacon border border-beacon/30 px-4 py-3 rounded-lg text-sm font-bold active:scale-95 transition-transform mt-2">
            {results.progressiveData ? 'Walk More to Refine' : 'Start Walking to Map More'}
          </button>

          {/* Reset Button */}
          <button onClick={resetMapping}
            className="w-full bg-surface-alt border border-gray-700 text-gray-300 px-4 py-3 rounded-lg text-sm font-medium active:scale-95 transition-transform mt-2">
            Map Again
          </button>
        </div>
      )}

      {/* Mic permission info */}
      {micPermission === false && (
        <div className="bg-surface rounded-xl p-4 border border-danger/30 mt-4">
          <h3 className="text-danger font-bold text-sm mb-2">Microphone Access Required</h3>
          <p className="text-gray-400 text-xs">
            This tool uses your phone's microphone and speaker to map your room acoustically.
            No audio data leaves your device — all processing happens locally in your browser.
          </p>
          <button onClick={startMapping}
            className="mt-3 bg-beacon/20 text-beacon px-4 py-2 rounded-lg text-sm w-full active:scale-95 transition-transform">
            Try Again
          </button>
        </div>
      )}

      {/* Footer */}
      {phase !== 'walking' && (
        <div className="text-center mt-8 text-gray-500 text-xs">
          <p>Acoustic Room Mapper v2.0</p>
          <p className="mt-0.5">All processing runs locally on your device</p>
        </div>
      )}

      {/* Sticky Finish Walking button — always visible during walking */}
      {phase === 'walking' && (
        <div className="fixed bottom-0 left-0 right-0 p-4 bg-[#0a0a0f]/90 backdrop-blur border-t border-gray-800 z-50">
          <button onClick={stopProgressiveMapping}
            className="w-full bg-warn text-black font-bold py-4 rounded-xl text-base active:scale-95 transition-transform max-w-lg mx-auto block">
            Finish Walking
          </button>
        </div>
      )}
    </div>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
